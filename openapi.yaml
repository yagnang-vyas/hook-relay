openapi: 3.1.0
info:
  title: HookRelay API
  version: 0.1.0
  summary: Self-hosted webhook reliability service.
  description: |
    HookRelay receives webhooks, verifies their signatures, stores them durably, forwards them to
    internal targets with retries, and lets operators inspect and replay them.

    **Delivery semantics are at-least-once.** A target can receive the same event more than once and
    must deduplicate on the `X-HookRelay-Event-Id` header HookRelay sends with every forwarded request.

    All `/api/*` endpoints require `Authorization: Bearer <ADMIN_API_KEY>`. Errors use a single shape,
    `{ "error": { "code", "message", "requestId" } }`, and every response carries `X-Request-Id`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
    description: Local development (docker compose binds to 127.0.0.1)
tags:
  - name: Ingest
    description: Public endpoint that providers call. Authenticated by webhook signature.
  - name: Events
    description: Inspect and replay stored events.
  - name: Deliveries
    description: Dead-letter queue handling.
  - name: Operations
    description: Health and metrics.

paths:
  /hooks/{sourceId}:
    post:
      tags: [Ingest]
      operationId: ingestWebhook
      summary: Receive a webhook
      description: |
        Verifies the signature over the **raw request body** using the scheme configured for the
        source, stores the event and one pending delivery per target in a single transaction, and
        only then responds `202`.

        A repeated `(sourceId, delivery ID)` pair answers `200 {"status":"duplicate"}` and creates
        nothing. If the source has no delivery ID header configured, or the request omits it, an ID
        is generated and the event is flagged `generatedId: true` (such events cannot be deduplicated).

        Request bodies larger than the source limit get `413`. `Content-Encoding` is not supported
        (`415`). Invalid signatures get a generic `401`; the reason is only logged and counted.
      security: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string }
          description: Source identifier from `hookrelay.config.json`.
        - name: X-Hub-Signature-256
          in: header
          required: false
          schema: { type: string }
          description: |
            Example of a signature header. The actual header name, format and scheme are defined
            per source (`hmac-sha256` or `timestamped-hmac-sha256`).
      requestBody:
        required: false
        description: Any payload. It is stored and forwarded as received, byte for byte.
        content:
          '*/*':
            schema: {}
      responses:
        '202':
          description: Accepted and durably stored.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                required: [status, eventId]
                properties:
                  status: { const: accepted }
                  eventId: { type: string, format: uuid }
        '200':
          description: Duplicate delivery ID; nothing was stored.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: duplicate }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Signature missing, malformed, wrong, or outside the timestamp tolerance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Body exceeds `maxBodyBytes`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Request used a `Content-Encoding`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: Newest first. Metadata only; bodies are never included.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: source
          in: query
          schema: { type: string }
          description: Only events from this source.
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DeliveryStatus' }
          description: Only events that have at least one delivery in this status.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
                  nextCursor:
                    type: [string, 'null']
                    description: Pass as `cursor` to get the next page; null on the last page.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an event with its deliveries and attempts
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: includeBody
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
          description: Include the stored payload as `bodyBase64` (null once purged).
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/events/{id}/replay:
    post:
      tags: [Events]
      operationId: replayEvent
      summary: Replay an event
      description: |
        Creates new pending deliveries for the event using the stored payload. By default all targets
        of the event's source are used; `targets` restricts the replay to a subset. Existing deliveries
        are untouched. Fails with `409` if the payload has been purged by the retention policy.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string }
      responses:
        '201':
          description: Deliveries created.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object
                      required: [id, targetId, status]
                      properties:
                        id: { type: string, format: uuid }
                        targetId: { type: string }
                        status: { $ref: '#/components/schemas/DeliveryStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The event body has been purged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/deliveries/dead:
    get:
      tags: [Deliveries]
      operationId: listDeadDeliveries
      summary: List dead-lettered deliveries
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of dead deliveries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DeadDelivery' }
                  nextCursor:
                    type: [string, 'null']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/deliveries/{id}/retry:
    post:
      tags: [Deliveries]
      operationId: retryDelivery
      summary: Move a dead delivery back to pending
      description: |
        Gives the delivery a fresh retry budget and makes it due immediately. Attempt numbering and
        history continue where they left off. Fails with `409` if the delivery is not dead or its
        event body has been purged.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requeued delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Delivery is not dead, or the body was purged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/metrics:
    get:
      tags: [Operations]
      operationId: getMetrics
      summary: In-process counters
      description: Counters since process start, for example `invalid_signatures_total` and `delivery_attempts_total`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current counter values.
          content:
            application/json:
              schema:
                type: object
                required: [counters]
                properties:
                  counters:
                    type: array
                    items:
                      type: object
                      required: [name, labels, value]
                      properties:
                        name: { type: string }
                        labels:
                          type: object
                          additionalProperties: { type: string }
                        value: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /healthz:
    get:
      tags: [Operations]
      operationId: healthz
      summary: Liveness
      description: The process is up.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }

  /readyz:
    get:
      tags: [Operations]
      operationId: readyz
      summary: Readiness
      description: The database is reachable and every migration shipped with this build has been applied.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ready }
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: { const: unavailable }
                  reason: { type: string, enum: [database_unreachable, migrations_pending] }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `ADMIN_API_KEY` configured for the service.
  headers:
    RequestId:
      description: Request ID, echoed from a well-formed inbound `X-Request-Id` or generated.
      schema: { type: string }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from a previous page's `nextCursor`.
  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid admin API key.
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected failure. Details are in the server log, keyed by `requestId`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, examples: [validation_error] }
            message: { type: string }
            requestId: { type: string }
    DeliveryStatus:
      type: string
      enum: [pending, in_flight, retrying, delivered, dead]
    EventSummary:
      type: object
      required:
        [
          id,
          sourceId,
          deliveryId,
          generatedId,
          contentType,
          headers,
          bodySize,
          bodyPurged,
          receivedAt,
          deliveries,
        ]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string }
        deliveryId: { type: string }
        generatedId: { type: boolean }
        contentType: { type: [string, 'null'] }
        headers:
          type: object
          description: Allow-listed request headers. Signature and credential headers are never stored.
          additionalProperties: { type: string }
        bodySize: { type: integer }
        bodyPurged: { type: boolean }
        receivedAt: { type: string, format: date-time }
        deliveries:
          type: array
          items:
            type: object
            required: [id, targetId, status, attempts]
            properties:
              id: { type: string, format: uuid }
              targetId: { type: string }
              status: { $ref: '#/components/schemas/DeliveryStatus' }
              attempts: { type: integer }
    EventDetail:
      type: object
      required:
        [
          id,
          sourceId,
          deliveryId,
          generatedId,
          contentType,
          headers,
          bodySize,
          bodyPurged,
          receivedAt,
          deliveries,
        ]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string }
        deliveryId: { type: string }
        generatedId: { type: boolean }
        contentType: { type: [string, 'null'] }
        headers:
          type: object
          additionalProperties: { type: string }
        bodySize: { type: integer }
        bodyPurged: { type: boolean }
        receivedAt: { type: string, format: date-time }
        bodyBase64:
          type: [string, 'null']
          description: Present only with `includeBody=true`; null once the body has been purged.
        deliveries:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Delivery'
              - type: object
                required: [attemptHistory]
                properties:
                  attemptHistory:
                    type: array
                    items: { $ref: '#/components/schemas/Attempt' }
    Delivery:
      type: object
      required:
        [
          id,
          eventId,
          targetId,
          status,
          attempts,
          attemptsBase,
          nextAttemptAt,
          leaseUntil,
          lastStatus,
          lastError,
          deadReason,
          createdAt,
          updatedAt,
          deliveredAt,
        ]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        targetId: { type: string }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        attempts:
          type: integer
          description: Lifetime number of attempts.
        attemptsBase:
          type: integer
          description: '`attempts` when the delivery last entered the queue; the retry budget applies to `attempts - attemptsBase`.'
        nextAttemptAt: { type: string, format: date-time }
        leaseUntil: { type: [string, 'null'], format: date-time }
        lastStatus: { type: [integer, 'null'], description: HTTP status of the last attempt. }
        lastError:
          {
            type: [string, 'null'],
            description: Short,
            payload-free description of the last failure.,
          }
        deadReason:
          type: [string, 'null']
          enum: [permanent_status, max_attempts, unknown_target, body_purged, null]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
    Attempt:
      type: object
      required: [id, attemptNumber, startedAt, durationMs, statusCode, error]
      properties:
        id: { type: string, format: uuid }
        attemptNumber: { type: integer }
        startedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        statusCode: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
    DeadDelivery:
      type: object
      required:
        [
          id,
          eventId,
          targetId,
          attempts,
          lastStatus,
          lastError,
          deadReason,
          createdAt,
          updatedAt,
          event,
        ]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        targetId: { type: string }
        attempts: { type: integer }
        lastStatus: { type: [integer, 'null'] }
        lastError: { type: [string, 'null'] }
        deadReason:
          type: [string, 'null']
          enum: [permanent_status, max_attempts, unknown_target, body_purged, null]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        event:
          type: object
          required: [sourceId, deliveryId, bodyPurged]
          properties:
            sourceId: { type: string }
            deliveryId: { type: string }
            bodyPurged: { type: boolean }
