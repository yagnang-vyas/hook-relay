# Netlify deploy of the HookRelay console (static SPA in web/). Additive only: the service itself
# is not deployed here. The Playground (Simulation Mode) runs entirely in the browser.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.19.0"

# --- Optional: point the dashboard at a hosted HookRelay -------------------------------------
# The service sends no CORS headers, so the browser must see one origin. Uncomment and replace
# the target with your public HTTPS HookRelay URL (it must be reachable from Netlify). Keep these
# ABOVE the 404 and SPA rules. Only the admin API and health routes are proxied, never /hooks/*.
# The admin key is still typed into the UI and is never stored in the bundle or this file.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://hookrelay.example.com/api/:splat"
#   status = 200
#   force = true
# [[redirects]]
#   from = "/healthz"
#   to = "https://hookrelay.example.com/healthz"
#   status = 200
#   force = true
# [[redirects]]
#   from = "/readyz"
#   to = "https://hookrelay.example.com/readyz"
#   status = 200
#   force = true

# With no backend proxied, return a real 404 (not index.html) so the dashboard shows a clear
# "API unavailable" state instead of trying to parse HTML as JSON.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/healthz"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/readyz"
  to = "/404.html"
  status = 404
  force = true

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
