# Same-origin front for the console: static files plus a reverse proxy to the HookRelay service.
# Only the admin API and health routes are proxied; the public /hooks/* ingest route is not.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

  location ~ ^/(api/|healthz$|readyz$) {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
